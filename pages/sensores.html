<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="shortcut icon" type="imagex/png" href="/assets/icons/logo_site.png">
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Sensores | MockingRail</title>
</head>
<body>
    <aside class="sidebar">
    
        <div class="logo-box">

            <h1 class="logo">
            R<span>Λ</span>IL
            </h1>

            <div class="logo-line"></div>

        </div>

        <div class="usuario-box">

            <i class="bi bi-person-fill"></i>

            <div class="usuario-info">
            <span>Usuário</span>
            <p>admin@mockingrail</p>
            </div>

        </div>

        <nav class="menu">

            <a href="/pages/menu.html" class="menu-item">
            <i class="bi bi-house-door-fill"></i>
            <span>MENU</span>
            </a>

            <a href="/pages/painel.html" class="menu-item">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>PAINEL</span>
            </a>

            <a href="/pages/sensores.html" class="menu-item active">
            <i class="bi bi-cpu-fill"></i>
            <span>SENSORES</span>
            </a>

            <a href="/pages/monitoramento.html" class="menu-item">
            <i class="bi bi-activity"></i>
            <span>MONITORAMENTO</span>
            </a>

            <a href="/pages/relatorios.html" class="menu-item">
            <i class="bi bi-file-earmark-bar-graph-fill"></i>
            <span>RELATÓRIOS</span>
            </a>

            <a href="/pages/usuarios.html" class="menu-item">
            <i class="bi bi-people-fill"></i>
            <span>USUÁRIOS</span>
            </a>

        </nav>

        <a href="/pages/login.html" class="sair">
        <i class="bi bi-box-arrow-left"></i>
        <span>SAIR</span> </a>

    </aside> 

    <div class="conteudo">

    <header class="cabecalho">
        <h2>SENSORES</h2>
        <h4>SISTEMA FERROVIÁRIO</h4>
    </header>

    <div class="sensor_caixa">

        <h2>
            <i class="bi bi-plus-circle"></i>
            CADASTRAR SENSOR
        </h2>

        <div class="sensor_form">

            <input type="text" class="sensor_input" id="nome" placeholder="Nome">

            <input type="text" class="sensor_input" id="tipo" placeholder="Tipo">

            <input type="text" class="sensor_input" id="local" placeholder="Local">

            <select class="sensor_select" id="status">

                <option>Ativo</option>
                <option>Inativo</option>

            </select>

            <button class="sensor_botao" onclick="salvarSensor()">

                <i class="bi bi-plus"></i>
                ADICIONAR

            </button>

        </div>

    </div>

    <div class="sensor_busca">

        <i class="bi bi-search"></i>
        <input type="text" id="buscar" placeholder="Buscar por nome ou ID">

    </div>

    <div id="sensorVazio" class="sensor-vazio">

        <i class="bi bi-broadcast"></i>

        <h4>Nenhum sensor cadastrado ainda.</h4>
        <p>Cadastre um novo sensor para começar.</p>

    </div>

    <table class="sensor_tabela">

        <thead>
            <tr>
                <th>ID</th>
                <th>NOME</th>
                <th>TIPO</th>
                <th>LOCAL</th>
                <th>STATUS</th>
                <th>AÇÕES</th>
            </tr>
        </thead>

        <tbody id="tabelaSensores"></tbody>

    </table>

</div>
    
</body>
</html>

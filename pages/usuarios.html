<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="shortcut icon" type="imagex/png" href="../assets/icons/logo_site.png">
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Usuários | MockingRail</title>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-box">
            <h1 class="logo">R<span>Λ</span>IL</h1>
            <div class="logo-line"></div>
        </div>

        <div class="usuario-box">
            <i class="bi bi-person-fill"></i>
            <div class="usuario-info">
                <span>Usuário</span>
                <p>admin@mockingrail</p>
            </div>
        </div>

        <nav class="menu">
            <a href="/pages/menu.html" class="menu-item">
                <i class="bi bi-house-door-fill"></i>
                <span>MENU</span>
            </a>
            <a href="/pages/painel.html" class="menu-item">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>PAINEL</span>
            </a>
            <a href="/pages/sensores.html" class="menu-item">
                <i class="bi bi-cpu-fill"></i>
                <span>SENSORES</span>
            </a>
            <a href="/pages/monitoramento.html" class="menu-item">
                <i class="bi bi-activity"></i>
                <span>MONITORAMENTO</span>
            </a>
            <a href="/pages/relatorios.html" class="menu-item">
                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                <span>RELATÓRIOS</span>
            </a>
            <a href="/pages/usuarios.html" class="menu-item active">
                <i class="bi bi-people-fill"></i>
                <span>USUÁRIOS</span>
            </a>
        </nav>

        <a href="/pages/login.html" class="sair">
            <i class="bi bi-box-arrow-left"></i>
            <span>SAIR</span>
        </a>
    </aside> 

    <main class="conteudo-principal">
        <h1 class="usuario__title">USUÁRIOS</h1>
        <h2 class="login__subtitle">SISTEMA FERROVIÁRIO</h2>

        <div class="container-fluid py-4 fundo">
            <div class="cadastro-box">
                <h2 class="usuario__title">CADASTRAR USUÁRIO</h2>

                <div class="row g-4 align-items-end">
                    <div class="col-md-3">
                        <label class="label-custom">NOME</label>
                        <input type="text" id="nome" class="form-control input-custom">
                    </div>

                    <div class="col-md-3">
                        <label class="label-custom">E-MAIL</label>
                        <input type="email" id="email" class="form-control input-custom">
                    </div>

                    <div class="col-md-3">
                        <label class="label-custom">TELEFONE</label>
                        <input type="text" id="telefone" class="form-control input-custom">
                    </div>

                    <div class="col-md-2">
                        <label class="label-custom">TIPO</label>
                        <select id="tipo" class="form-select input-custom select-custom">
                            <option value="" selected disabled>SELECIONE</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Usuário">Usuário</option>
                        </select>
                    </div>

                    <div class="col-md-1 d-flex align-items-end">
                        <!-- Adicionado id="btnAdicionar" -->
                        <button id="btnAdicionar" class="btn botao-custom w-100">+ADICIONAR</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="sensor_busca">
            <i class="bi bi-search"></i>
            <input type="text" id="buscar" placeholder="Buscar por nome ou ID">
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOME</th>
                        <th>E-MAIL</th>
                        <th>TELEFONE</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                </tbody>
            </table>
        </div>
    </main>

    <script src="../js/usuarios.js"></script>
</body>
</html>
